<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Hybrid Repair - Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-family: 'Material Symbols Outlined', sans-serif;
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-error-container": "#93000a",
                        "surface-dim": "#d8d9e3",
                        "on-surface-variant": "#414754",
                        "on-tertiary-container": "#0e0200",
                        "primary-fixed": "#d8e2ff",
                        "surface-variant": "#e0e2ec",
                        "outline": "#727785",
                        "on-tertiary-fixed-variant": "#783100",
                        "on-tertiary": "#ffffff",
                        "inverse-surface": "#2d3038",
                        "on-tertiary-fixed": "#341100",
                        "tertiary": "#9e4300",
                        "surface-bright": "#f9f9ff",
                        "surface-container": "#ecedf7",
                        "secondary-container": "#d0e1fb",
                        "surface-container-lowest": "#ffffff",
                        "on-primary-fixed": "#001a41",
                        "surface-tint": "#005bc0",
                        "on-primary-container": "#ffffff",
                        "primary-fixed-dim": "#adc7ff",
                        "on-secondary-container": "#54647a",
                        "background": "#f9f9ff",
                        "primary-container": "#1a73e8",
                        "surface": "#f9f9ff",
                        "tertiary-fixed": "#ffdbcb",
                        "primary": "#005bbf",
                        "secondary": "#505f76",
                        "secondary-fixed": "#d3e4fe",
                        "on-primary": "#ffffff",
                        "surface-container-high": "#e6e8f2",
                        "on-secondary-fixed": "#0b1c30",
                        "inverse-primary": "#adc7ff",
                        "surface-container-highest": "#e0e2ec",
                        "secondary-fixed-dim": "#b7c8e1",
                        "on-surface": "#191c23",
                        "inverse-on-surface": "#eff0fa",
                        "surface-container-low": "#f2f3fd",
                        "outline-variant": "#c1c6d6",
                        "error-container": "#ffdad6",
                        "on-background": "#191c23",
                        "error": "#ba1a1a",
                        "on-primary-fixed-variant": "#004493",
                        "on-error": "#ffffff",
                        "tertiary-fixed-dim": "#ffb691",
                        "tertiary-container": "#c55500",
                        "on-secondary-fixed-variant": "#38485d",
                        "on-secondary": "#ffffff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "md": "16px",
                        "lg": "24px",
                        "margin-mobile": "16px",
                        "xs": "4px",
                        "xl": "32px",
                        "sm": "8px",
                        "base": "8px",
                        "container-max": "1280px",
                        "gutter": "20px"
                    },
                    "fontFamily": {
                        "label-md": ["Inter"],
                        "headline-lg-mobile": ["Inter"],
                        "body-lg": ["Inter"],
                        "title-lg": ["Inter"],
                        "body-md": ["Inter"],
                        "headline-lg": ["Inter"],
                        "code": ["JetBrains Mono"],
                        "headline-md": ["Inter"],
                        "display-lg": ["Inter"]
                    },
                    "fontSize": {
                        "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "500" }],
                        "headline-lg-mobile": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "title-lg": ["18px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "code": ["13px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700" }]

                }
            }
        }
    </script>
</head>
<body class="bg-surface-container min-h-screen flex items-center justify-center p-margin-mobile md:p-xl antialiased selection:bg-primary/20 selection:text-primary">
<!-- Transactional Intent: Navigation Shell Suppressed -->
<main class="w-full max-w-[420px] bg-surface-container-lowest border border-outline-variant rounded-xl p-lg md:p-xl flex flex-col gap-xl shadow-sm">
<!-- Header / Branding -->
<header class="flex flex-col items-center text-center gap-sm">
<div class="w-12 h-12 bg-primary-container rounded-lg flex items-center justify-center mb-xs">
<span class="material-symbols-outlined text-on-primary-container text-[28px]" style="font-variation-settings: 'FILL' 1;">precision_manufacturing</span>
</div>
<h1 class="font-headline-md text-headline-md text-on-surface">Hybrid Repair</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Sign in to manage your workspace</p>
</header>
<!-- Login Form -->
<form action="#" class="flex flex-col gap-lg" method="POST">
<!-- Email Input -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant ml-[2px]" for="email">Email address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-outline text-[20px] pointer-events-none">mail</span>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg pl-[44px] pr-md py-[10px] font-body-md text-body-md text-on-surface placeholder:text-outline-variant focus:outline-none focus:border-primary focus:ring-[3px] focus:ring-primary/20 transition-all duration-200" id="email" name="email" placeholder="manager@hybridrepair.co.uk" required="" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant ml-[2px]" for="password">Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-outline text-[20px] pointer-events-none">lock</span>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg pl-[44px] pr-md py-[10px] font-body-md text-body-md text-on-surface placeholder:text-outline-variant focus:outline-none focus:border-primary focus:ring-[3px] focus:ring-primary/20 transition-all duration-200" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Action Button -->
<button class="w-full bg-primary text-on-primary border border-transparent rounded-lg py-[10px] font-label-md text-label-md hover:bg-on-primary-fixed-variant active:scale-[0.98] transition-all duration-200 flex items-center justify-center gap-sm mt-xs" type="submit">
<span>Login to Suite</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</form>
<!-- Secondary Actions -->
<div class="flex flex-col items-center gap-md pt-sm border-t border-outline-variant/50">
<a class="font-label-md text-label-md text-primary hover:text-on-primary-fixed-variant hover:underline transition-colors" href="#">
                Forgot password?
            </a>
<p class="font-label-md text-label-md text-outline">
                Version 1.0.4 • Corporate Access Only
            </p>
</div>
</main>
</body></html>
