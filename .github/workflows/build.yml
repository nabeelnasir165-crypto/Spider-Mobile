name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Lint & build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present || true

      - name: Build
        run: npm run build

      - name: Report bundle size
        run: |
          echo "::group::Bundle size"
          du -h dist/assets/*.js dist/assets/*.css 2>/dev/null || true
          echo "::endgroup::"
